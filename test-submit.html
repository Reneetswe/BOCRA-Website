<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test License Application Submission</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 2rem;
            background: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #006B5E;
            margin-bottom: 1rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }
        button {
            padding: 1rem 2rem;
            background: #006B5E;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
        }
        button:hover {
            background: #004D43;
        }
        .result {
            margin-top: 2rem;
            padding: 1rem;
            border-radius: 4px;
            display: none;
        }
        .result.success {
            background: #E8F5E9;
            border: 1px solid #4CAF50;
            color: #2E7D32;
        }
        .result.error {
            background: #FFEBEE;
            border: 1px solid #D4415E;
            color: #C62828;
        }
        .result h3 {
            margin-top: 0;
        }
        pre {
            background: #f5f5f5;
            padding: 1rem;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 0.875rem;
        }
        .info {
            background: #FDF6E3;
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 2rem;
            border-left: 4px solid #C9A227;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test License Application Submission</h1>
        
        <div class="info">
            <strong>Purpose:</strong> This page tests if your license application data is being saved to the database.
            Fill out the form below and submit. We'll show you exactly what happens.
        </div>

        <form id="testForm">
            <div class="form-group">
                <label>First Name *</label>
                <input type="text" id="firstName" value="John" required>
            </div>

            <div class="form-group">
                <label>Last Name *</label>
                <input type="text" id="lastName" value="Doe" required>
            </div>

            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="email" value="john.doe@example.com" required>
            </div>

            <div class="form-group">
                <label>Phone *</label>
                <input type="tel" id="phone" value="+267 71234567" required>
            </div>

            <div class="form-group">
                <label>Company Name (Optional)</label>
                <input type="text" id="companyName" value="">
            </div>

            <div class="form-group">
                <label>License Type *</label>
                <select id="licenseType" required>
                    <option value="Broadcasting Licence">Broadcasting Licence</option>
                    <option value="Cellular Licence">Cellular Licence</option>
                    <option value="Type Approval Licence">Type Approval Licence</option>
                    <option value="VANS Licence">VANS Licence</option>
                </select>
            </div>

            <div class="form-group">
                <label>Physical Address *</label>
                <input type="text" id="address" value="Gaborone, Botswana" required>
            </div>

            <button type="submit">Submit Test Application</button>
        </form>

        <div id="result" class="result">
            <h3 id="resultTitle"></h3>
            <div id="resultMessage"></div>
            <pre id="resultData"></pre>
        </div>
    </div>

    <script>
        document.getElementById('testForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                applicant_name: document.getElementById('firstName').value + ' ' + document.getElementById('lastName').value,
                applicant_email: document.getElementById('email').value,
                applicant_phone: document.getElementById('phone').value,
                business_type: document.getElementById('companyName').value ? 'company' : 'individual',
                company_name: document.getElementById('companyName').value || '',
                registration_number: '',
                tax_number: '',
                license_type: document.getElementById('licenseType').value,
                physical_address: document.getElementById('address').value,
                postal_address: '',
                business_description: 'Test application for ' + document.getElementById('licenseType').value,
                proposed_services: document.getElementById('licenseType').value,
                technical_capacity: 'As per uploaded documentation',
                financial_capacity: 'As per uploaded documentation'
            };

            console.log('Submitting data:', formData);

            const resultDiv = document.getElementById('result');
            const resultTitle = document.getElementById('resultTitle');
            const resultMessage = document.getElementById('resultMessage');
            const resultData = document.getElementById('resultData');

            try {
                const response = await fetch('api/submit-license-application.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                console.log('API Response:', result);

                resultDiv.style.display = 'block';

                if (result.success) {
                    resultDiv.className = 'result success';
                    resultTitle.textContent = '✅ Success!';
                    resultMessage.innerHTML = `
                        <p><strong>Application Number:</strong> ${result.application_number}</p>
                        <p><strong>Application ID:</strong> ${result.application_id}</p>
                        <p style="margin-top: 1rem;">
                            <strong>Next Steps:</strong><br>
                            1. Check if it appears in database: <a href="test-applications.php" target="_blank">View All Applications</a><br>
                            2. Check if it appears in your dashboard: <a href="dashboard.html" target="_blank">Open Dashboard</a><br>
                            3. Check PHP error log at: <code>C:\\xampp\\apache\\logs\\error.log</code>
                        </p>
                    `;
                    resultData.textContent = JSON.stringify(result, null, 2);
                } else {
                    resultDiv.className = 'result error';
                    resultTitle.textContent = '❌ Error!';
                    resultMessage.innerHTML = `<p><strong>Error Message:</strong> ${result.message}</p>`;
                    resultData.textContent = JSON.stringify(result, null, 2);
                }
            } catch (error) {
                resultDiv.style.display = 'block';
                resultDiv.className = 'result error';
                resultTitle.textContent = '❌ Network Error!';
                resultMessage.innerHTML = `<p><strong>Error:</strong> ${error.message}</p>`;
                resultData.textContent = error.stack;
            }
        });
    </script>
</body>
</html>
